name: OpenWrt build caches
description: Configure the source tree and restore compiler and optional download caches.
inputs:
  cache-downloads:
    description: Keep a monthly seed of source archives for download-heavy builds.
    default: 'false'

runs:
  using: composite
  steps:
    - name: Identify the build inputs
      id: build
      working-directory: /builder/openwrt
      shell: bash
      run: |
        make defconfig
        grep -qx 'CONFIG_CCACHE=y' .config
        cache_dir=$(make -s --no-print-directory val.CCACHE_DIR)
        if [[ "$cache_dir" != "$PWD/.ccache" ]]; then
          echo "::error::OpenWrt writes to $cache_dir, but CI archives $PWD/.ccache"
          exit 1
        fi
        mkdir -p .ccache
        test ! -L .ccache

        # Rebuilt compilers can have identical contents and different timestamps.
        {
          echo "CCACHE_DIR=$PWD/.ccache"
          echo "CCACHE_COMPILERCHECK=content"
          echo "CCACHE_MAXSIZE=2G"
          echo "CCACHE_STATSLOG=$RUNNER_TEMP/openwrt-ccache.stats"
        } >> "$GITHUB_ENV"

        scope="${RUNNER_OS}-${RUNNER_ARCH}-${REPO_URL##*/}-${REPO_BRANCH}-${BOARD}-${SWMODE:-default}"
        {
          echo "scope=$scope"
          # Archives are immutable: a key that follows every source or config change
          # re-uploads on each build. Rotate weekly instead; ccache itself validates
          # compiler content and per-object compile options before any hit.
          echo "ccache_week=$(date -u +%G-W%V)"
          echo "month=$(date -u +%Y-%m)"
        } >> "$GITHUB_OUTPUT"

    - name: Restore compiler results
      id: ccache
      uses: actions/cache@v6.1.0
      with:
        path: /builder/openwrt/.ccache
        key: ccache-v3-${{ steps.build.outputs.scope }}-${{ steps.build.outputs.ccache_week }}
        restore-keys: |
          ccache-v3-${{ steps.build.outputs.scope }}-
          ccache-v2-${{ steps.build.outputs.scope }}-

    - name: Report compiler cache match
      shell: bash
      env:
        CACHE_HIT: ${{ steps.ccache.outputs.cache-hit }}
      run: |
        case "$CACHE_HIT" in
          true)  echo 'ccache archive: exact hit' ;;
          false) echo 'ccache archive: restored from an older key (see restore log)' ;;
          *)     echo 'ccache archive: miss or unavailable' ;;
        esac

    # A single seed per month avoids uploading a multi-GB archive for each feed update.
    # make download still runs on every build to fetch new or changed sources.
    # Go's module cache (dl/go-mod-cache) is excluded: it is the transitive closure of
    # every package's go.mod, so a stale seed makes Go report missing packages once a
    # feed bumps a dependency instead of re-downloading it.
    - name: Restore source downloads
      if: inputs.cache-downloads == 'true'
      uses: actions/cache@v6.1.0
      with:
        path: |
          /builder/openwrt/dl
          !/builder/openwrt/dl/go-mod-cache
        key: dl-v2-${{ steps.build.outputs.scope }}-${{ steps.build.outputs.month }}
        restore-keys: |
          dl-v2-${{ steps.build.outputs.scope }}-
